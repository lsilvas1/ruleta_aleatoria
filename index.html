<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta de Ganador</title>
<style>
body{font-family:Arial,sans-serif;background:#1e3a8a;color:#fff;text-align:center;margin:0;padding:20px}
.container{max-width:900px;margin:auto}
textarea{width:100%;height:120px;border-radius:8px;padding:10px}
button{margin:8px;padding:10px 18px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
canvas{background:#fff;border-radius:50%;margin-top:20px}
#winner{font-size:28px;margin-top:20px;font-weight:bold;color:#fde047}
</style>
</head>
<body>
<div class="container">
<h1>🎡 Ruleta Universales INFRA</h1>
<p>Escribe un nombre por línea y presiona <b>Cargar Participantes</b>.</p>
<textarea id="names">Participante 1
Participante 2
Participante 3
</textarea><br>
<button onclick="loadNames()">Cargar Participantes</button>
<button onclick="spin()">Girar</button>

<button onclick="shuffleNames()">🔀 Intercambiar participantes</button>

<label><input type="checkbox" id="remove"> Eliminar ganador después del sorteo</label>
<div><canvas id="wheel" width="500" height="500"></canvas></div>
<div id="winner">Sin ganador aún.</div>
</div>
<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
let names=[],angle=0,spinning=false;
function randColor(i){return `hsl(${(i*360/Math.max(names.length,1))%360},70%,60%)`;}
function loadNames(){
 names=document.getElementById("names").value.split("\n").map(x=>x.trim()).filter(Boolean);
 draw();
 document.getElementById("winner").textContent=`Participantes: ${names.length}`;
}
function draw(){
 ctx.clearRect(0,0,500,500);
 if(names.length===0)return;
 const cx=250,cy=250,r=240;
 const slice=2*Math.PI/names.length;
 for(let i=0;i<names.length;i++){
   ctx.beginPath();
   ctx.moveTo(cx,cy);
   ctx.arc(cx,cy,r,angle+i*slice,angle+(i+1)*slice);
   ctx.closePath();
   ctx.fillStyle=randColor(i);
   ctx.fill();
   ctx.save();
   ctx.translate(cx,cy);
   ctx.rotate(angle+i*slice+slice/2);
   ctx.textAlign="right";
   ctx.fillStyle="#000";
   ctx.font="16px Arial";
   ctx.fillText(names[i],r-10,5);
   ctx.restore();
 }
 ctx.beginPath();
 ctx.arc(cx,cy,40,0,Math.PI*2);
 ctx.fillStyle="#222";ctx.fill();
 ctx.fillStyle="#fff";ctx.font="20px Arial";
 ctx.textAlign="center";ctx.fillText("GIRA",250,257);
 ctx.fillStyle="red";
 ctx.beginPath();
 ctx.moveTo(250,5);ctx.lineTo(238,30);ctx.lineTo(262,30);ctx.closePath();ctx.fill();
}

function shuffleNames(){
  if(spinning || names.length<2) return;
  for(let i=names.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [names[i],names[j]]=[names[j],names[i]];
  }
  document.getElementById("names").value=names.join("\n");
  draw();
  document.getElementById("winner").textContent="Participantes reordenados aleatoriamente.";
}


function spin(){
 if(spinning||names.length<2)return;
 spinning=true;
 const target=Math.random()*Math.PI*2+Math.PI*10;
 const start=performance.now();
 const duration=5000;
 const startAngle=angle;
 function anim(t){
   let p=Math.min((t-start)/duration,1);
   let e=1-Math.pow(1-p,3);
   angle=startAngle+target*e;
   draw();
   if(p<1) requestAnimationFrame(anim);
   else{
     finish();
     spinning=false;
   }
 }
 requestAnimationFrame(anim);
}
function finish(){
 const slice=2*Math.PI/names.length;
 let pointer=(-Math.PI/2-angle)%(2*Math.PI);
 if(pointer<0)pointer+=2*Math.PI;
 const index=(Math.floor(pointer/slice)+names.length)%names.length;
 const winner=names[index];
 document.getElementById("winner").innerHTML="🏆 Ganador: <b>"+winner+"</b> 🎉";
 if(document.getElementById("remove").checked){
   names.splice(index,1);
   document.getElementById("names").value=names.join("\n");
   setTimeout(draw,500);
 }
}
loadNames();
</script>
</body>
</html>
